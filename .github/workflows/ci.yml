name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libglib2.0-0 libfontconfig1 libdbus-1-3
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[gui,dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type-check
        run: mypy
      - name: Tests (offline, tiny synthetic fixtures)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80
